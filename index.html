<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>圆珠笔突围 · BALLPOINT BREACH</title>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="paper-lines" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>

    <section id="hud" aria-label="游戏状态">
      <div class="hud-score">得分 <strong data-hud="score">0</strong></div>
      <div id="minimap" aria-hidden="true">
        <canvas id="minimap-canvas" width="296" height="316"></canvas>
        <span class="minimap-label">施工场</span>
      </div>
      <div class="hud-wave"><strong data-hud="wave">第 1 波</strong><small data-hud="enemies">剩余 0 个</small></div>

      <div id="boss-health">
        <strong data-hud="boss-name">涂鸦者</strong>
        <i data-hud="boss-bar"></i>
      </div>

      <div id="reload-status"><span>换弹中</span><i data-hud="reload-bar"></i></div>
      <div class="hud-health"><span>生命</span><i data-hud="health-bar"></i><b data-hud="health">100</b></div>
      <div class="hud-ammo"><strong data-hud="ammo">30</strong><span data-hud="reserve">/150</span><div class="ammo-ticks">//// //// //// //// //</div></div>

      <div class="hud-weapons">
        <ol>
          <li data-weapon-slot="1" class="selected"><span>步枪</span><em data-weapon-ammo>30/150</em></li>
          <li data-weapon-slot="2"><span>霰弹枪</span><em data-weapon-ammo>6/30</em></li>
          <li data-weapon-slot="3"><span>左轮</span><em data-weapon-ammo>6/36</em></li>
          <li data-weapon-slot="4"><span>狙击枪</span><em data-weapon-ammo>5/25</em></li>
          <li data-weapon-slot="5"><span>武士刀</span><em data-weapon-ammo>∞</em></li>
        </ol>
        <strong data-hud="weapon-name">步枪</strong>
        <small data-hud="weapon-description">全自动 · 右键展开全息瞄准</small>
      </div>

      <div class="ability-meter grapple-meter"><span>Q · 钩索</span><i data-hud="grapple-bar"></i></div>
      <div id="block-stamina" class="ability-meter"><span>格挡</span><i data-hud="block-bar"></i></div>

      <div id="context-tip">钩住敌人，把它拽下高台</div>
      <div id="wave-banner"><strong id="wave-banner-title">第 1 波</strong><span id="wave-banner-subtitle">纸上第一道笔痕</span></div>
      <div class="crosshair"><i></i><i></i><i></i><i></i></div>
      <div id="hit-marker"><i></i><i></i><i></i><i></i></div>
      <div id="damage-indicator"></div>
      <div id="scope-overlay"><div class="scope-reticle"><i></i><i></i></div></div>
    </section>

    <section id="game-overlay" class="visible" data-mode="loading">
      <div class="overlay-card">
        <p class="eyebrow">BALLPOINT BREACH</p>
        <h1 id="overlay-title">圆珠笔<br>突围</h1>
        <p id="overlay-copy">正在削铅笔…</p>
        <button id="start-button" type="button" disabled>点击进入</button>
        <button id="restart-button" type="button" hidden>重画一局</button>
        <div class="controls-grid">
          <span><b>WASD</b> 移动</span><span><b>SHIFT</b> 冲刺</span><span><b>SPACE</b> 跳跃</span>
          <span><b>1–5</b> 切换武器</span><span><b>R</b> 装填</span><span><b>Q</b> 钩索</span>
          <span><b>左键</b> 射击 / 挥砍</span><span><b>右键</b> 瞄准 / 格挡</span><span><b>ESC</b> 暂停</span>
        </div>
      </div>
    </section>

    <div id="stage" role="status">施工场 · 可玩原型</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
